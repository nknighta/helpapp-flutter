name: jp.ac.chuo.machinaka
description: "まちなか保健室アプリ"

version: 0.1.7+1

environment:
  sdk: ^3.7.2

# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  mapbox_maps_flutter: ^2.0.0
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  permission_handler: ^12.0.0+1
  location: ^8.0.0
  flutter_chat_ui: ^1.6.15
  hooks_riverpod: ^2.6.1
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.1
  firebase_core: ^3.13.1
  google_sign_in: ^6.3.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.0
  background_task: ^0.2.0+2
  flutter_dotenv: ^5.2.1
  change_app_package_name: ^1.4.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^18.0.1
  firebase_messaging: ^15.1.8
  flutter_launcher_icons: ^0.14.4
  sqflite: ^2.0.0
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/images/
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icons/helpappicon_rounded.png"
  android_adaptive_icon_background: "#000000"
  android_adaptive_icon_foreground: "assets/icons/helpappicon_rounded.png"
